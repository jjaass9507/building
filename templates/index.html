<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASE建物管理平台</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>

    <script>
        // 部署成 IIS 子應用程式時 (例如掛在 /building_platform 底下)，前端不能用
        // '/api/...' 這種絕對路徑，否則會打到網站根目錄而不是這個應用程式。
        // request.script_root 就是應用程式掛載的前綴，掛在根目錄時是空字串。
        window.APP_BASE = "{{ request.script_root }}";
    </script>

    <script>
        if (localStorage.getItem('theme') === 'dark' || 
            (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260907-concept-c">
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans flex flex-col min-h-screen overflow-hidden transition-colors duration-300">

    <div id="app" class="flex flex-col h-screen">
        <div class="flex flex-col items-center justify-center h-full gap-4">
            <div class="w-12 h-12 border-4 border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
            <div class="text-slate-400 dark:text-slate-500 font-medium tracking-widest animate-pulse">
                載入系統中...
            </div>
        </div>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}?v=20260907-concept-c"></script>
    <script type="module" src="{{ url_for('static', filename='js/trend-overlay.js') }}?v=20260819-perf-observer"></script>
    <script type="module" src="{{ url_for('static', filename='js/utility-trend-admin.js') }}?v=20260819-perf-observer"></script>
    <script type="module" src="{{ url_for('static', filename='js/site-area-sharing.js') }}?v=20260819-perf-observer"></script>
</body>
</html>
